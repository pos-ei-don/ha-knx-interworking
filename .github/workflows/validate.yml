name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly — catches breakage from new Home Assistant / HACS releases.
    - cron: "0 4 * * 1"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Not (yet) in the home-assistant/brands repo — that is a separate
          # submission. Skip the brands check so CI reflects the real state.
          ignore: brands
